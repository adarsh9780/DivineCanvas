name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies and apply native patches
        run: npm ci

      - name: Install Android SDK packages
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdk_manager" --licenses < <(yes 2>/dev/null) >/dev/null
          "$sdk_manager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

          # Expo SDK 58 declares compileSdk as 37, while Google's package uses the minor version in its path.
          sdk_platforms="$ANDROID_HOME/platforms"
          if [[ ! -e "$sdk_platforms/android-37" ]]; then
            ln -s android-37.0 "$sdk_platforms/android-37"
          fi
          test -f "$sdk_platforms/android-37/android.jar"

      - name: Generate the Android project
        run: npm exec -- expo prebuild --platform android --no-install --clean

      - name: Build the standalone ARM64 APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK signing
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DivineCanvas-android-arm64
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

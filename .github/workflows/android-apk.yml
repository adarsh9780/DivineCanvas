name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies and apply native patches
        run: npm ci

      - name: Use the runner JDK for React Native Gradle
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'node_modules/@react-native/gradle-plugin/settings.gradle.kts';
          const settings = fs.readFileSync(path, 'utf8');
          // setup-java already supplies JDK 17 on this runner.
          const resolver = 'plugins { id("org.gradle.toolchains.foojay-resolver-convention").version("1.0.0") }';
          if (!settings.includes(resolver)) throw new Error('Review the React Native JDK setup after upgrading Gradle.');
          fs.writeFileSync(path, settings.replace(resolver, ''));
          NODE

      - name: Install Android SDK packages
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdk_manager" --licenses < <(yes 2>/dev/null) >/dev/null
          "$sdk_manager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

          # Expo SDK 58 declares compileSdk as 37, while Google's package uses the minor version in its path.
          sdk_platforms="$ANDROID_HOME/platforms"
          if [[ ! -e "$sdk_platforms/android-37" ]]; then
            ln -s android-37.0 "$sdk_platforms/android-37"
          fi
          test -f "$sdk_platforms/android-37/android.jar"

      - name: Generate the Android project
        run: npm exec -- expo prebuild --platform android --no-install --clean

      - name: Configure EAS signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/divinecanvas-release.jks"
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'android/app/build.gradle';
          let gradle = fs.readFileSync(path, 'utf8');
          const debugConfig = '    signingConfigs {\n        debug {';
          const releaseConfig = `    signingConfigs {
              release {
                  storeFile file(System.getenv("RUNNER_TEMP") + "/divinecanvas-release.jks")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
              debug {`;
          if (!gradle.includes(debugConfig)) throw new Error('Android signing configuration changed');
          gradle = gradle.replace(debugConfig, releaseConfig);
          const releaseType = /release \{([\s\S]*?)signingConfig signingConfigs\.debug/;
          if (!releaseType.test(gradle)) throw new Error('Android release signing configuration changed');
          gradle = gradle.replace(releaseType, 'release {$1signingConfig signingConfigs.release');
          gradle = gradle.replace(/versionCode \d+/, `versionCode ${100000 + Number(process.env.GITHUB_RUN_NUMBER)}`);
          fs.writeFileSync(path, gradle);
          NODE

      - name: Build the standalone ARM64 APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK signing
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DivineCanvas-android-arm64
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
